name: Orchestratore lezioni

# PRIMA ESECUZIONE: manuale; attivare la pianificazione solo dopo un test completo.
# Il workflow remoto è inizialmente disabilitato: non elaborerà dati da solo.
on:
  workflow_dispatch:
  # Quando sei pronto, decommenta sotto. GitHub esegue i cron in UTC;
  # l'orario può subire ritardi e le esecuzioni non sono garantite.
  # schedule:
  #   - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: orchestratore
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Prepara metadati Kaggle privati
        run: python scripts/prepare_kernel.py
        env:
          KAGGLE_KERNEL_DIR: kaggle_kernel
          KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
          KAGGLE_DATASET_SLUG: ${{ secrets.KAGGLE_DATASET_SLUG }}
      - name: Esegui un ciclo dell'orchestratore
        run: python orchestratore.py
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLASSIFIER_MODE: ${{ vars.CLASSIFIER_MODE }}
          ALLOW_GEMINI_IF_TERMS_MET: ${{ vars.ALLOW_GEMINI_IF_TERMS_MET }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
          KAGGLE_KERNEL_DIR: kaggle_kernel
          ORPHEUS_WORKER_CONTRACT_VERIFIED: ${{ vars.ORPHEUS_WORKER_CONTRACT_VERIFIED }}
          FOLDER_AUDIO_INCOMING: ${{ secrets.FOLDER_AUDIO_INCOMING }}
          FOLDER_PROCESSING_KAGGLE: ${{ secrets.FOLDER_PROCESSING_KAGGLE }}
          FOLDER_TRASCRIZIONI: ${{ secrets.FOLDER_TRASCRIZIONI }}
          FOLDER_TRASCRIZIONI_ELABORATE: ${{ secrets.FOLDER_TRASCRIZIONI_ELABORATE }}
          FOLDER_AUDIO_COMPLETATI: ${{ secrets.FOLDER_AUDIO_COMPLETATI }}
          FOLDER_ERRORI: ${{ secrets.FOLDER_ERRORI }}
          FOLDER_RADICE_MATERIE: ${{ secrets.FOLDER_RADICE_MATERIE }}
          MATERIE_FOLDER_IDS: ${{ secrets.MATERIE_FOLDER_IDS }}
