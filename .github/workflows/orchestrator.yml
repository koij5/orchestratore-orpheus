name: Orchestratore lezioni

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Una sola esecuzione alla volta: le successive aspettano in coda
concurrency:
  group: orchestratore
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python orchestratore.py
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}     # es. "utente/whisper-trascrizione"
          KAGGLE_KERNEL_DIR: kaggle_kernel                          # cartella nel repo con notebook + kernel-metadata.json
          FOLDER_AUDIO_INCOMING: ${{ secrets.FOLDER_AUDIO_INCOMING }}
          FOLDER_PROCESSING_KAGGLE: ${{ secrets.FOLDER_PROCESSING_KAGGLE }}
          FOLDER_TRASCRIZIONI: ${{ secrets.FOLDER_TRASCRIZIONI }}
          FOLDER_TRASCRIZIONI_ELABORATE: ${{ secrets.FOLDER_TRASCRIZIONI_ELABORATE }}
          FOLDER_AUDIO_COMPLETATI: ${{ secrets.FOLDER_AUDIO_COMPLETATI }}
          FOLDER_ERRORI: ${{ secrets.FOLDER_ERRORI }}
          FOLDER_RADICE_MATERIE: ${{ secrets.FOLDER_RADICE_MATERIE }}
